<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 708" width="724" height="708" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Checkout platform in its environment: Context diagram for the Checkout platform</title><desc id="dg-desc">Context diagram for the Checkout platform. 6 elements: Shopper (person), Support agent (person), Checkout platform (software system), Stripe (external software system), Postmark (external software system), Warehouse system (external software system). 5 relationships: Shopper to Checkout platform: Places orders and pays; Support agent to Checkout platform: Looks up orders and issues refunds; Checkout platform to Stripe: Authorises and captures payments; Checkout platform to Postmark: Sends order emails; Checkout platform to Warehouse system: Sends paid orders for fulfilment.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}</style><rect class="bg" x="0.5" y="0.5" width="723" height="707" rx="12"/><text class="title" x="24" y="44">Checkout platform in its environment</text><text class="sub" x="24" y="64">Context diagram for the Checkout platform</text><g transform="translate(24 84)"><path class="e" d="M303 124L303 231"/><path class="ah" d="M303 238L298.8 229L307.2 229z"/><path class="e" d="M537 124L537 211Q537 218 530 218L379.5 218Q373 218 373 224.5L373 231"/><path class="ah" d="M373 238L368.8 229L377.2 229z"/><path class="e" d="M286 336L286 349Q286 356 279 356L111 356Q104 356 104 363L104 443"/><path class="ah" d="M104 450L99.8 441L108.2 441z"/><path class="e" d="M338 336L338 443"/><path class="ah" d="M338 450L333.8 441L342.2 441z"/><path class="e" d="M390 336L390 349Q390 356 397 356L565 356Q572 356 572 363L572 443"/><path class="ah" d="M572 450L567.8 441L576.2 441z"/><rect class="sh f-person" x="199" y="16" width="208" height="108" rx="20"/><circle class="glyph" cx="303" cy="31.5" r="6.5"/><path class="glyph" d="M292 50a11 10 0 0 1 22 0z"/><text class="nm" x="303" y="69.5">Shopper</text><text class="ty" x="303" y="85.5">[Person]</text><text class="ds" x="303" y="106.5">Buys goods from the storefront</text><rect class="sh f-person" x="433" y="0" width="208" height="124" rx="20"/><circle class="glyph" cx="537" cy="15.5" r="6.5"/><path class="glyph" d="M526 34a11 10 0 0 1 22 0z"/><text class="nm" x="537" y="53.5">Support agent</text><text class="ty" x="537" y="69.5">[Person]</text><text class="ds" x="537" y="90.5">Resolves order and refund</text><text class="ds" x="537" y="106.5">queries</text><rect class="sh f-system" x="234" y="238" width="208" height="98" rx="7"/><text class="nm" x="338" y="265.5">Checkout platform</text><text class="ty" x="338" y="281.5">[Software System]</text><text class="ds" x="338" y="302.5">Takes orders, collects payment</text><text class="ds" x="338" y="318.5">and arranges fulfilment</text><rect class="sh f-external" x="0" y="450" width="208" height="82" rx="7"/><text class="nm" x="104" y="477.5">Stripe</text><text class="ty" x="104" y="493.5">[External Software System]</text><text class="ds" x="104" y="514.5">Processes card payments</text><rect class="sh f-external" x="234" y="450" width="208" height="82" rx="7"/><text class="nm" x="338" y="477.5">Postmark</text><text class="ty" x="338" y="493.5">[External Software System]</text><text class="ds" x="338" y="514.5">Delivers transactional email</text><rect class="sh f-external" x="468" y="450" width="208" height="82" rx="7"/><text class="nm" x="572" y="477.5">Warehouse system</text><text class="ty" x="572" y="493.5">[External Software System]</text><text class="ds" x="572" y="514.5">Picks, packs and ships orders</text><rect class="halo" x="227" y="157.5" width="151" height="33" rx="4"/><text class="el" x="302.5" y="171.5">Places orders and pays</text><text class="et" x="302.5" y="184.5">[HTTPS]</text><rect class="halo" x="470" y="150" width="134" height="48" rx="4"/><text class="el" x="537" y="164">Looks up orders and</text><text class="el" x="537" y="178.5">issues refunds</text><text class="et" x="537" y="191.5">[HTTPS]</text><rect class="halo" x="26" y="376" width="156" height="48" rx="4"/><text class="el" x="104" y="390">Authorises and captures</text><text class="el" x="104" y="404.5">payments</text><text class="et" x="104" y="417.5">[HTTPS]</text><rect class="halo" x="274" y="383.5" width="127" height="33" rx="4"/><text class="el" x="337.5" y="397.5">Sends order emails</text><text class="et" x="337.5" y="410.5">[HTTPS]</text><rect class="halo" x="502" y="376" width="140" height="48" rx="4"/><text class="el" x="572" y="390">Sends paid orders for</text><text class="el" x="572" y="404.5">fulfilment</text><text class="et" x="572" y="417.5">[HTTPS]</text></g><path class="rule" d="M24 642H700"/><text class="kh" x="24" y="660">KEY</text><rect class="sh f-person" x="24" y="672" width="26" height="16" rx="8"/><circle class="glyph" cx="37" cy="677.7" r="2.7"/><path class="glyph" d="M32.4 685.5a4.6 4.2 0 0 1 9.2 0z"/><text class="kt" x="57" y="684">Person</text><rect class="sh f-system" x="116.3" y="672" width="26" height="16" rx="3"/><text class="kt" x="149.3" y="684">Software System</text><rect class="sh f-external" x="263.2" y="672" width="26" height="16" rx="3"/><text class="kt" x="296.2" y="684">External</text><path class="e" d="M361.8 680L384.8 680"/><path class="ah" d="M391.8 680L382.8 684.2L382.8 675.8z"/><text class="kt" x="398.8" y="684">Relationship</text></svg>
