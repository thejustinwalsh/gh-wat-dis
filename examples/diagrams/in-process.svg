<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 827 1340" width="827" height="1340" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Text layout moves off the main thread: Component diagram for the editor monorepo, inside one browser tab</title><desc id="dg-desc">Component diagram for the editor monorepo, inside one browser tab. 11 elements: Browser tab (deployment node), Main thread (boundary), Layout worker (boundary, added), layout-core.wasm (boundary), @app/editor (component, changed), @app/renderer (component), @app/layout-client (component, added), @app/layout-worker (component, added), layout-core (component, affected), shaper (component), Glyph atlas (data store). 8 relationships: @app/editor to @app/layout-client: Requests layout for dirty paragraphs (added); @app/layout-client to @app/layout-worker: Posts LayoutRequest, gets glyph runs back (added); @app/layout-worker to layout-core: Calls layout_paragraph (added); layout-core to shaper: Shapes each run with; @app/layout-worker to Glyph atlas: Writes glyph bitmaps to (added); @app/renderer to Glyph atlas: Reads glyphs from; @app/editor to @app/renderer: Submits glyph runs to; @app/editor to layout-core: Called layout_paragraph on the main thread (removed).</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-s