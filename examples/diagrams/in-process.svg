ke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}.fd{font-size:12px;fill:var(--muted)}.fs{font-size:10.5px;fill:var(--muted)}.fb{font-size:12px;font-weight:600;fill:var(--fg)}.fn{font-size:11px;fill:var(--muted)}.sy{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.sk{font-size:10px;fill:var(--muted);text-anchor:end}.sm{font-size:13px;text-anchor:middle}.card{stroke:var(--stroke);stroke-width:1}.lane{fill:var(--group)}.ln{font-size:10.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="826" height="1339" rx="12"/><text class="title" x="24" y="44">Text layout moves off the main thread</text><text class="sub" x="24" y="64">Component diagram for the editor monorepo, inside one browser tab</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="0" width="779" height="1138" rx="9"/><rect class="sh grp f-bg" x="94" y="55" width="483" height="287" rx="9"/><rect class="sh grp f-bg s-added" x="164" y="462" width="597" height="489" rx="9"/><rect class="sh grp f-group" x="389" y="679" width="358" height="258" rx="9"/><path class="e e-added" d="M440 166L440 255.5"/><path class="b-added" d="M440 262.5L435.8 253.5L444.2 253.5z"/><path class="e e-added" d="M440 325.5L440 513"/><path class="b-added" d="M440 520L435.8 511L444.2 511z"/><path class="e e-added" d="M440 583L440 590Q440 597 447 597L576 597Q583 597 583 604L583 651Q583 658 590 658L622 658Q629 658 629 665L629 730"/><path class="b-added" d="M629 73