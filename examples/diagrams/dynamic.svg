<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 540" width="776" height="540" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Placing an order: Dynamic diagram for a successful card checkout</title><desc id="dg-desc">Dynamic diagram for a successful card checkout. 8 elements: Shopper (person), Storefront (container), API gateway (container), Order service (container), Inventory service (container), Payment service (container), Stripe (external software system), Order events (queue). 7 relationships: Shopper to Storefront: 1. Submits the checkout form; Storefront to API gateway: 2. Posts the order; API gateway to Order service: 3. Creates the order; Order service to Inventory service: 4. Reserves stock; Order service to Payment service: 5. Authorises the payment; Payment service to Stripe: 6. Confirms the payment intent; Order service to Order events: 7. Publishes OrderPlaced.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="775" height="539" rx="12"/><text class="title" x="24" y="44">Placing an order</text><text class="sub" x="24" y="64">Dynamic diagram for a successful card checkout</text><g transform="translate(24 84)"><path class="e" d="M204 42L259 42"/><path class="ah" d="M266 42L257 46.2L257 37.8z"/><path class="e" d="M442 42L483 42"/><path class="ah" d="M490 42L481 46.2L481 37.8z"/><path class="e" d="M666 42L721 42Q728 42 728 49L728 108Q728 115 721 115L7 115Q0 115 0 122L0 242Q0 249 7 249L21 249"/><path class="ah" d="M28 249L19 253.2L19 244.8z"/><path class="e" d="M204 236L211 236Q218 236 218 229L218 182Q218 175 225 175L259 175"/><path class="ah" d="M266 175L257 179.2L257 170.8z"/><path class="e" d="M204 249L259 249"/><path class="ah" d="M266 249L257 253.2L257 244.8z"/><path class="e" d="M442 249L483 249"/><path class="ah" d="M490 249L481 253.2L481 244.8z"/><path class="e" d="M204 263L211 263Q218 263 218 270L218 323Q218 330 225 330L259 330"/><path class="ah" d="M266 330L257 334.2L257 325.8z"/><rect class="sh f-person" x="28" y="0" width="176" height="83" rx="20"/><circle class="glyph" cx="116" cy="15.5" r="6.5"/><path class="glyph" d="M105 34a11 10 0 0 1 22 0z"/><text class="nm" x="116" y="53.5">Shopper</text><text class="ty" x="116" y="69.5">[Person]</text><rect class="sh f-container" x="266" y="8" width="176" height="68" rx="7"/><text class="nm" x="354" y="32.5">Storefront</text><text class="ty" x="354" y="48.5">[Container: TypeScript,</text><text class="ty" x="354" y="62.5">Next.js]</text><rect class="sh f-container" x="490" y="8" width="176" height="68" rx="7"/><text class="nm" x="578" y="32.5">API gateway</text><text class="ty" x="578" y="48.5">[Container: TypeScript,</text><text class="ty" x="578" y="62.5">Fastify]</text><rect class="sh f-container" x="28" y="222" width="176" height="54" rx="7"/><text class="nm" x="116" y="246.5">Order service</text><text class="ty" x="116" y="262.5">[Container: Rust, Axum]</text><rect class="sh f-container" x="266" y="148" width="176" height="54" rx="7"/><text class="nm" x="354" y="172.5">Inventory service</text><text class="ty" x="354" y="188.5">[Container: Rust, Tonic]</text><rect class="sh f-container" x="266" y="222" width="176" height="54" rx="7"/><text class="nm" x="354" y="246.5">Payment service</text><text class="ty" x="354" y="262.5">[Container: Rust, Axum]</text><rect class="sh f-external" x="490" y="222" width="176" height="54" rx="7"/><text class="nm" x="578" y="246.5">Stripe</text><text class="ty" x="578" y="262.5">[External Software System]</text><path class="sh f-store" d="M277 296H431A11 34 0 0 1 431 364H277A11 34 0 0 1 277 296Z"/><path class="sh f-store dt" d="M431 296A11 34 0 0 0 431 364"/><text class="nm" x="354" y="320.5">Order events</text><text class="ty" x="354" y="336.5">[Queue: NATS</text><text class="ty" x="354" y="350.5">JetStream]</text><rect class="num" x="232" y="31" width="20" height="20" rx="10"/><text class="en" x="242" y="45">1</text><rect class="num" x="456" y="31" width="20" height="20" rx="10"/><text class="en" x="466" y="45">2</text><rect class="num" x="680" y="31" width="20" height="20" rx="10"/><text class="en" x="690" y="45">3</text><rect class="num" x="232" y="164" width="20" height="20" rx="10"/><text class="en" x="242" y="178">4</text><rect class="num" x="232" y="238" width="20" height="20" rx="10"/><text class="en" x="242" y="252">5</text><rect class="num" x="456" y="238" width="20" height="20" rx="10"/><text class="en" x="466" y="252">6</text><rect class="num" x="232" y="319" width="20" height="20" rx="10"/><text class="en" x="242" y="333">7</text></g><path class="rule" d="M24 474H752"/><text class="kh" x="24" y="492">KEY</text><rect class="sh f-person" x="24" y="504" width="26" height="16" rx="8"/><circle class="glyph" cx="37" cy="509.7" r="2.7"/><path class="glyph" d="M32.4 517.5a4.6 4.2 0 0 1 9.2 0z"/><text class="kt" x="57" y="516">Person</text><rect class="sh f-container" x="116.3" y="504" width="26" height="16" rx="3"/><text class="kt" x="149.3" y="516">Container</text><path class="sh f-store" d="M227.2 504H245.2A4 8 0 0 1 245.2 520H227.2A4 8 0 0 1 227.2 504Z"/><path class="sh f-store dt" d="M245.2 504A4 8 0 0 0 245.2 520"/><text class="kt" x="256.2" y="516">Queue</text><rect class="sh f-external" x="313.5" y="504" width="26" height="16" rx="3"/><text class="kt" x="346.5" y="516">External</text><path class="e" d="M412 512L435 512"/><path class="ah" d="M442 512L433 516.2L433 507.8z"/><text class="kt" x="449" y="516">Numbered step</text></svg>
