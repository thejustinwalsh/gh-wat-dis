<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 884" width="712" height="884" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Placing an order: Dynamic diagram for a successful card checkout</title><desc id="dg-desc">Dynamic diagram for a successful card checkout. 8 elements: Shopper (person), Storefront (container), API gateway (container), Order service (container), Inventory service (container), Payment service (container), Stripe (external software system), Order events (queue). 7 relationships: Shopper to Storefront: 1. Submits the checkout form; Storefront to API gateway: 2. Posts the order; API gateway to Order service: 3. Creates the order; Order service to Inventory service: 4. Reserves stock; Order service to Payment service: 5. Authorises the payment; Payment service to Stripe: 6. Confirms the payment intent; Order service to Order events: 7. Publishes OrderPlaced.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}</style><rect class="bg" x="0.5" y="0.5" width="711" height="883" rx="12"/><text class="title" x="24" y="44">Placing an order</text><text class="sub" x="24" y="64">Dynamic diagram for a successful card checkout</text><g transform="translate(24 84)"><path class="e" d="M332 83L332 145"/><path class="ah" d="M332 152L327.8 143L336.2 143z"/><path class="e" d="M332 206L332 268"/><path class="ah" d="M332 275L327.8 266L336.2 266z"/><path class="e" d="M332 329L332 391"/><path class="ah" d="M332 398L327.8 389L336.2 389z"/><path class="e" d="M280 452L280 459Q280 466 273 466L111 466Q104 466 104 473L104 524"/><path class="ah" d="M104 531L99.8 522L108.2 522z"/><path class="e" d="M332 452L332 524"/><path class="ah" d="M332 531L327.8 522L336.2 522z"/><path class="e" d="M332 585L332 647"/><path class="ah" d="M332 654L327.8 645L336.2 645z"/><path class="e" d="M384 452L384 459Q384 466 391 466L553 466Q560 466 560 473L560 524"/><path class="ah" d="M560 531L555.8 522L564.2 522z"/><rect class="sh f-person" x="228" y="0" width="208" height="83" rx="20"/><circle class="glyph" cx="332" cy="15.5" r="6.5"/><path class="glyph" d="M321 34a11 10 0 0 1 22 0z"/><text class="nm" x="332" y="53.5">Shopper</text><text class="ty" x="332" y="69.5">[Person]</text><rect class="sh f-container" x="228" y="152" width="208" height="54" rx="7"/><text class="nm" x="332" y="176.5">Storefront</text><text class="ty" x="332" y="192.5">[Container: TypeScript, Next.js]</text><rect class="sh f-container" x="228" y="275" width="208" height="54" rx="7"/><text class="nm" x="332" y="299.5">API gateway</text><text class="ty" x="332" y="315.5">[Container: TypeScript, Fastify]</text><rect class="sh f-container" x="228" y="398" width="208" height="54" rx="7"/><text class="nm" x="332" y="422.5">Order service</text><text class="ty" x="332" y="438.5">[Container: Rust, Axum]</text><rect class="sh f-container" x="0" y="531" width="208" height="54" rx="7"/><text class="nm" x="104" y="555.5">Inventory service</text><text class="ty" x="104" y="571.5">[Container: Rust, Tonic]</text><rect class="sh f-container" x="228" y="531" width="208" height="54" rx="7"/><text class="nm" x="332" y="555.5">Payment service</text><text class="ty" x="332" y="571.5">[Container: Rust, Axum]</text><rect class="sh f-external" x="228" y="654" width="208" height="54" rx="7"/><text class="nm" x="332" y="678.5">Stripe</text><text class="ty" x="332" y="694.5">[External Software System]</text><path class="sh f-store" d="M467 531H653A11 27 0 0 1 653 585H467A11 27 0 0 1 467 531Z"/><path class="sh f-store dt" d="M653 531A11 27 0 0 0 653 585"/><text class="nm" x="560" y="555.5">Order events</text><text class="ty" x="560" y="571.5">[Queue: NATS JetStream]</text><rect class="halo" x="239" y="101" width="185" height="33" rx="4"/><text class="el" x="331.5" y="115">1. Submits the checkout form</text><text class="et" x="331.5" y="128">[HTTPS]</text><rect class="halo" x="273" y="224" width="117" height="33" rx="4"/><text class="el" x="331.5" y="238">2. Posts the order</text><text class="et" x="331.5" y="251">[JSON/HTTPS]</text><rect class="halo" x="266" y="347" width="131" height="33" rx="4"/><text class="el" x="331.5" y="361">3. Creates the order</text><text class="et" x="331.5" y="374">[gRPC]</text><rect class="halo" x="45" y="480" width="118" height="33" rx="4"/><text class="el" x="104" y="494">4. Reserves stock</text><text class="et" x="104" y="507">[gRPC]</text><rect class="halo" x="248" y="480" width="167" height="33" rx="4"/><text class="el" x="331.5" y="494">5. Authorises the payment</text><text class="et" x="331.5" y="507">[gRPC]</text><rect class="halo" x="235" y="603" width="193" height="33" rx="4"/><text class="el" x="331.5" y="617">6. Confirms the payment intent</text><text class="et" x="331.5" y="630">[HTTPS]</text><rect class="halo" x="478" y="480" width="163" height="33" rx="4"/><text class="el" x="559.5" y="494">7. Publishes OrderPlaced</text><text class="et" x="559.5" y="507">[NATS]</text></g><path class="rule" d="M24 818H688"/><text class="kh" x="24" y="836">KEY</text><rect class="sh f-person" x="24" y="848" width="26" height="16" rx="8"/><circle class="glyph" cx="37" cy="853.7" r="2.7"/><path class="glyph" d="M32.4 861.5a4.6 4.2 0 0 1 9.2 0z"/><text class="kt" x="57" y="860">Person</text><rect class="sh f-container" x="116.3" y="848" width="26" height="16" rx="3"/><text class="kt" x="149.3" y="860">Container</text><path class="sh f-store" d="M227.2 848H245.2A4 8 0 0 1 245.2 864H227.2A4 8 0 0 1 227.2 848Z"/><path class="sh f-store dt" d="M245.2 848A4 8 0 0 0 245.2 864"/><text class="kt" x="256.2" y="860">Queue</text><rect class="sh f-external" x="313.5" y="848" width="26" height="16" rx="3"/><text class="kt" x="346.5" y="860">External</text><path class="e" d="M412 856L435 856"/><path class="ah" d="M442 856L433 860.2L433 851.8z"/><text class="kt" x="449" y="860">Numbered step</text></svg>
