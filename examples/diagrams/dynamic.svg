<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 1227" width="724" height="1227" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Placing an order: Dynamic diagram for a successful card checkout</title><desc id="dg-desc">Dynamic diagram for a successful card checkout. 8 elements: Shopper (person), Storefront (container), API gateway (container), Order service (container), Inventory service (container), Payment service (container), Stripe (external software system), Order events (queue). 7 relationships: Shopper to Storefront: 1. Submits the checkout form; Storefront to API gateway: 2. Posts the order; API gateway to Order service: 3. Creates the order; Order service to Inventory service: 4. Reserves stock; Order service to Payment service: 5. Authorises the payment; Payment service to Stripe: 6. Confirms the payment intent; Order service to Order events: 7. Publishes OrderPlaced.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}</style><rect class="bg" x="0.5" y="0.5" width="723" height="1226" rx="12"/><text class="title" x="24" y="44">Placing an order</text><text class="sub" x="24" y="64">Dynamic diagram for a successful card checkout</text><g transform="translate(24 84)"><path class="e" d="M338 108L338 201"/><path class="ah" d="M338 208L333.8 199L342.2 199z"/><path class="e" d="M338 306L338 384"/><path class="ah" d="M338 391L333.8 382L342.2 382z"/><path class="e" d="M338 489L338 567"/><path class="ah" d="M338 574L333.8 565L342.2 565z"/><path class="e" d="M286 672L286 685Q286 692 279 692L111 692Q104 692 104 699L104 764"/><path class="ah" d="M104 771L99.8 762L108.2 762z"/><path class="e" d="M338 672L338 764"/><path class="ah" d="M338 771L333.8 762L342.2 762z"/><path class="e" d="M338 869L338 962"/><path class="ah" d="M338 969L333.8 960L342.2 960z"/><path class="e" d="M390 672L390 685Q390 692 397 692L565 692Q572 692 572 699L572 764"/><path class="ah" d="M572 771L567.8 762L576.2 762z"/><rect class="sh f-person" x="234" y="0" width="208" height="108" rx="20"/><circle class="glyph" cx="338" cy="15.5" r="6.5"/><path class="glyph" d="M327 34a11 10 0 0 1 22 0z"/><text class="nm" x="338" y="53.5">Shopper</text><text class="ty" x="338" y="69.5">[Person]</text><text class="ds" x="338" y="90.5">Buys goods from the storefront</text><rect class="sh f-container" x="234" y="208" width="208" height="98" rx="7"/><text class="nm" x="338" y="235.5">Storefront</text><text class="ty" x="338" y="251.5">[Container: TypeScript, Next.js]</text><text class="ds" x="338" y="272.5">Renders the catalogue, basket</text><text class="ds" x="338" y="288.5">and checkout pages</text><rect class="sh f-container" x="234" y="391" width="208" height="98" rx="7"/><text class="nm" x="338" y="418.5">API gateway</text><text class="ty" x="338" y="434.5">[Container: TypeScript, Fastify]</text><text class="ds" x="338" y="455.5">Authenticates sessions and</text><text class="ds" x="338" y="471.5">routes API calls</text><rect class="sh f-container" x="234" y="574" width="208" height="98" rx="7"/><text class="nm" x="338" y="601.5">Order service</text><text class="ty" x="338" y="617.5">[Container: Rust, Axum]</text><text class="ds" x="338" y="638.5">Owns the order lifecycle from</text><text class="ds" x="338" y="654.5">basket to fulfilment</text><rect class="sh f-container" x="0" y="771" width="208" height="82" rx="7"/><text class="nm" x="104" y="798.5">Inventory service</text><text class="ty" x="104" y="814.5">[Container: Rust, Tonic]</text><text class="ds" x="104" y="835.5">Reserves and releases stock</text><rect class="sh f-container" x="234" y="771" width="208" height="98" rx="7"/><text class="nm" x="338" y="798.5">Payment service</text><text class="ty" x="338" y="814.5">[Container: Rust, Axum]</text><text class="ds" x="338" y="835.5">Authorises and captures card</text><text class="ds" x="338" y="851.5">payments</text><rect class="sh f-external" x="234" y="969" width="208" height="82" rx="7"/><text class="nm" x="338" y="996.5">Stripe</text><text class="ty" x="338" y="1012.5">[External Software System]</text><text class="ds" x="338" y="1033.5">Processes card payments</text><path class="sh f-store" d="M479 771H665A11 49 0 0 1 665 869H479A11 49 0 0 1 479 771Z"/><path class="sh f-store dt" d="M665 771A11 49 0 0 0 665 869"/><text class="nm" x="572" y="798.5">Order events</text><text class="ty" x="572" y="814.5">[Queue: NATS JetStream]</text><text class="ds" x="572" y="835.5">Carries order lifecycle</text><text class="ds" x="572" y="851.5">events</text><rect class="halo" x="261" y="134" width="154" height="48" rx="4"/><text class="el" x="338" y="148">1. Submits the checkout</text><text class="el" x="338" y="162.5">form</text><text class="et" x="338" y="175.5">[HTTPS]</text><rect class="halo" x="279" y="332" width="117" height="33" rx="4"/><text class="el" x="337.5" y="346">2. Posts the order</text><text class="et" x="337.5" y="359">[JSON/HTTPS]</text><rect class="halo" x="272" y="515" width="131" height="33" rx="4"/><text class="el" x="337.5" y="529">3. Creates the order</text><text class="et" x="337.5" y="542">[gRPC]</text><rect class="halo" x="45" y="712" width="118" height="33" rx="4"/><text class="el" x="104" y="726">4. Reserves stock</text><text class="et" x="104" y="739">[gRPC]</text><rect class="halo" x="254" y="712" width="167" height="33" rx="4"/><text class="el" x="337.5" y="726">5. Authorises the payment</text><text class="et" x="337.5" y="739">[gRPC]</text><rect class="halo" x="259" y="895" width="157" height="48" rx="4"/><text class="el" x="337.5" y="909">6. Confirms the payment</text><text class="el" x="337.5" y="923.5">intent</text><text class="et" x="337.5" y="936.5">[HTTPS]</text><rect class="halo" x="490" y="712" width="163" height="33" rx="4"/><text class="el" x="571.5" y="726">7. Publishes OrderPlaced</text><text class="et" x="571.5" y="739">[NATS]</text></g><path class="rule" d="M24 1161H700"/><text class="kh" x="24" y="1179">KEY</text><rect class="sh f-person" x="24" y="1191" width="26" height="16" rx="8"/><circle class="glyph" cx="37" cy="1196.7" r="2.7"/><path class="glyph" d="M32.4 1204.5a4.6 4.2 0 0 1 9.2 0z"/><text class="kt" x="57" y="1203">Person</text><rect class="sh f-container" x="116.3" y="1191" width="26" height="16" rx="3"/><text class="kt" x="149.3" y="1203">Container</text><path class="sh f-store" d="M227.2 1191H245.2A4 8 0 0 1 245.2 1207H227.2A4 8 0 0 1 227.2 1191Z"/><path class="sh f-store dt" d="M245.2 1191A4 8 0 0 0 245.2 1207"/><text class="kt" x="256.2" y="1203">Queue</text><rect class="sh f-external" x="313.5" y="1191" width="26" height="16" rx="3"/><text class="kt" x="346.5" y="1203">External</text><path class="e" d="M412 1199L435 1199"/><path class="ah" d="M442 1199L433 1203.2L433 1194.8z"/><text class="kt" x="449" y="1203">Numbered step</text></svg>
