<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 726 1386" width="726" height="1386" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Screen payments for fraud before capture: Container diagram for the fraud screening change</title><desc id="dg-desc">Container diagram for the fraud screening change. 9 elements: Checkout platform (software system), API gateway (container), Order service (container, affected), Payment service (container, changed), Fraud screening service (container, added), Nightly fraud job (container, removed), Orders database (data store), Order events (queue), Stripe (external software system). 8 relationships: API gateway to Order service: Places and reads orders; Order service to Payment service: Requests authorisation with basket and device details (changed); Payment service to Fraud screening service: Asks for a risk score (added); Fraud screening service to Order events: Publishes fraud decisions (added); Nightly fraud job to Orders database: Scanned yesterday&#39;s orders (removed); Order service to Orders database: Reads and writes orders (affected); Order service to Order events: Publishes order events; Payment service to Stripe: Creates payment intents.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}</style><rect class="bg" x="0.5" y="0.5" width="725" height="1385" rx="12"/><text class="title" x="24" y="44">Screen payments for fraud before capture</text><text class="sub" x="24" y="64">Container diagram for the fraud screening change</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="0" width="678" height="1010" rx="9"/><path class="e" d="M206 144L206 222"/><path class="ah" d="M206 229L201.8 220L210.2 220z"/><path class="e e-changed" d="M206 327L206 442Q206 449 213 449L280.5 449Q287 449 287 455.5L287 462"/><path class="b-changed" d="M287 469L282.8 460L291.2 460z"/><path class="e e-added" d="M252 583L252 675"/><path class="b-added" d="M252 682L247.8 673L256.2 673z"/><path class="e e-added" d="M252 780L252 887"/><path class="b-added" d="M252 894L247.8 885L256.2 885z"/><path class="e e-removed" d="M556 327L556 462.5"/><path class="b-removed" d="M556 469.5L551.8 460.5L560.2 460.5z"/><path class="e e-affected" d="M258 327L258 340Q258 347 265 347L377 347Q384 347 384 354L384 442Q384 449 391 449L479.3 449Q486 449 486 455.7L486 462.5"/><path class="b-affected" d="M486 469.5L481.8 460.5L490.2 460.5z"/><path class="e" d="M154 327L154 340Q154 347 147 347L99 347Q92 347 92 354L92 867Q92 874 99 874L175.5 874Q182 874 182 880.5L182 887"/><path class="ah" d="M182 894L177.8 885L186.2 885z"/><path class="e" d="M322 583L322 596Q322 603 329 603L367 603Q374 603 374 610L374 1095"/><path class="ah" d="M374 1102L369.8 1093L378.2 1093z"/><rect class="f-group" x="10" y="12" width="229.9" height="20" rx="3"/><text class="gn" x="14" y="26">Checkout platform<tspan class="gk" dx="8">[Software System]</tspan></text><rect class="sh f-container" x="102" y="46" width="208" height="98" rx="7"/><text class="nm" x="206" y="73.5">API gateway</text><text class="ty" x="206" y="89.5">[Container: TypeScript, Fastify]</text><text class="ds" x="206" y="110.5">Authenticates sessions and</text><text class="ds" x="206" y="126.5">routes API calls</text><rect class="sh f-container s-affected" x="102" y="229" width="208" height="98" rx="7"/><rect class="ring" x="98" y="225" width="216" height="106" rx="11"/><text class="nm" x="206" y="256.5">Order service</text><text class="ty" x="206" y="272.5">[Container: Rust, Axum]</text><text class="ds" x="206" y="293.5">Owns the order lifecycle from</text><text class="ds" x="206" y="309.5">basket to fulfilment</text><rect class="b-affected" x="228.1" y="220" width="71.9" height="18" rx="9"/><text class="bt" x="264" y="232.5">AFFECTED</text><rect class="sh f-container s-changed" x="183" y="469" width="208" height="114" rx="7"/><text class="nm" x="287" y="496.5">Payment service</text><text class="ty" x="287" y="512.5">[Container: Rust, Axum]</text><text class="ds" x="287" y="533.5">Authorises card payments and</text><text class="ds" x="287" y="549.5">now waits for a risk score</text><text class="ds" x="287" y="565.5">before capture</text><rect class="b-changed" x="302.6" y="460" width="78.4" height="18" rx="9"/><text class="bt" x="341.8" y="472.5">~ CHANGED</text><rect class="sh f-container s-added" x="148" y="682" width="208" height="98" rx="7"/><text class="nm" x="252" y="709.5">Fraud screening service</text><text class="ty" x="252" y="725.5">[Container: Rust, Axum]</text><text class="ds" x="252" y="746.5">Scores each payment attempt</text><text class="ds" x="252" y="762.5">against risk rules</text><rect class="b-added" x="284.1" y="673" width="61.9" height="18" rx="9"/><text class="bt" x="315.1" y="685.5">+ ADDED</text><g class="gone"><rect class="sh f-container s-removed" x="452" y="229" width="208" height="98" rx="7"/><text class="nm" x="556" y="256.5">Nightly fraud job</text><path class="strike" d="M501.9 252h108.2"/><text class="ty" x="556" y="272.5">[Container: TypeScript, Node.js]</text><text class="ds" x="556" y="293.5">Flagged risky orders after the</text><text class="ds" x="556" y="309.5">fact</text></g><rect class="b-removed" x="571" y="220" width="79" height="18" rx="9"/><text class="bt" x="610.5" y="232.5">− REMOVED</text><path class="sh f-store" d="M417 477A104 8 0 0 1 625 477V572A104 8 0 0 1 417 572Z"/><path class="sh f-store dt" d="M417 477A104 8 0 0 0 625 477"/><text class="nm" x="521" y="506.5">Orders database</text><text class="ty" x="521" y="522.5">[Data Store: PostgreSQL 16]</text><text class="ds" x="521" y="543.5">Stores orders, payments and</text><text class="ds" x="521" y="559.5">stock reservations</text><path class="sh f-store" d="M124 894H310A11 49 0 0 1 310 992H124A11 49 0 0 1 124 894Z"/><path class="sh f-store dt" d="M310 894A11 49 0 0 0 310 992"/><text class="nm" x="217" y="921.5">Order events</text><text class="ty" x="217" y="937.5">[Queue: NATS JetStream]</text><text class="ds" x="217" y="958.5">Carries order lifecycle</text><text class="ds" x="217" y="974.5">events</text><rect class="sh f-external" x="270" y="1102" width="208" height="82" rx="7"/><text class="nm" x="374" y="1129.5">Stripe</text><text class="ty" x="374" y="1145.5">[External Software System]</text><text class="ds" x="374" y="1166.5">Processes card payments</text><rect class="halo" x="127" y="170" width="157" height="33" rx="4"/><text class="el" x="205.5" y="184">Places and reads orders</text><text class="et" x="205.5" y="197">[gRPC]</text><rect class="halo" x="126" y="367" width="160" height="62" rx="4"/><text class="el" x="206" y="381"><tspan class="m-changed">~</tspan> Requests authorisation</text><text class="el" x="206" y="395.5">with basket and device</text><text class="el" x="206" y="410">details</text><text class="et" x="206" y="423">[gRPC]</text><rect class="halo" x="180" y="623" width="144" height="33" rx="4"/><text class="el" x="252" y="637"><tspan class="m-added">+</tspan> Asks for a risk score</text><text class="et" x="252" y="650">[gRPC]</text><rect class="halo" x="194" y="806" width="116" height="48" rx="4"/><text class="el" x="252" y="820"><tspan class="m-added">+</tspan> Publishes fraud</text><text class="el" x="252" y="834.5">decisions</text><text class="et" x="252" y="847.5">[NATS]</text><rect class="halo" x="482" y="374" width="147" height="48" rx="4"/><text class="el" x="555.5" y="388"><tspan class="m-removed">−</tspan> Scanned yesterday&#39;s</text><text class="el" x="555.5" y="402.5">orders</text><text class="et" x="555.5" y="415.5">[SQL]</text><rect class="halo" x="300" y="381.5" width="168" height="33" rx="4"/><text class="el" x="384" y="395.5"><tspan class="m-affected">•</tspan> Reads and writes orders</text><text class="et" x="384" y="408.5">[SQL]</text><rect class="halo" x="18" y="623" width="148" height="33" rx="4"/><text class="el" x="92" y="637">Publishes order events</text><text class="et" x="92" y="650">[NATS]</text><rect class="halo" x="295" y="1043" width="157" height="33" rx="4"/><text class="el" x="373.5" y="1057">Creates payment intents</text><text class="et" x="373.5" y="1070">[HTTPS]</text></g><path class="rule" d="M24 1294H702"/><text class="kh" x="24" y="1312">KEY</text><rect class="sh f-container" x="24" y="1324" width="26" height="16" rx="3"/><text class="kt" x="57" y="1336">Container</text><path class="sh f-store" d="M130.8 1327A13 3 0 0 1 156.8 1327V1337A13 3 0 0 1 130.8 1337Z"/><path class="sh f-store dt" d="M130.8 1327A13 3 0 0 0 156.8 1327"/><text class="kt" x="163.8" y="1336">Data Store</text><path class="sh f-store" d="M247.2 1324H265.2A4 8 0 0 1 265.2 1340H247.2A4 8 0 0 1 247.2 1324Z"/><path class="sh f-store dt" d="M265.2 1324A4 8 0 0 0 265.2 1340"/><text class="kt" x="276.2" y="1336">Queue</text><rect class="sh f-external" x="333.5" y="1324" width="26" height="16" rx="3"/><text class="kt" x="366.5" y="1336">External</text><rect class="sh grp f-group" x="432" y="1324" width="26" height="16" rx="3"/><text class="kt" x="465" y="1336">Boundary</text><path class="e" d="M538.2 1332L561.2 1332"/><path class="ah" d="M568.2 1332L559.2 1336.2L559.2 1327.8z"/><text class="kt" x="575.2" y="1336">Relationship</text><rect class="sh f-container s-added" x="26" y="1352" width="22" height="12" rx="3"/><path class="e e-added" d="M56 1358L79 1358"/><path class="b-added" d="M86 1358L77 1362.2L77 1353.8z"/><text class="kt" x="93" y="1362">+ Added</text><rect class="sh f-container s-changed" x="161.6" y="1352" width="22" height="12" rx="3"/><path class="e e-changed" d="M191.6 1358L214.6 1358"/><path class="b-changed" d="M221.6 1358L212.6 1362.2L212.6 1353.8z"/><text class="kt" x="228.6" y="1362">~ Changed</text><rect class="sh f-container s-removed" x="311.7" y="1352" width="22" height="12" rx="3"/><path class="e e-removed" d="M341.7 1358L364.7 1358"/><path class="b-removed" d="M371.7 1358L362.7 1362.2L362.7 1353.8z"/><text class="kt" x="378.7" y="1362">− Removed</text><rect class="sh f-container s-affected" x="464.6" y="1352" width="22" height="12" rx="3"/><rect class="ring" x="461.6" y="1349" width="28" height="18" rx="5"/><path class="e e-affected" d="M494.6 1358L517.6 1358"/><path class="b-affected" d="M524.6 1358L515.6 1362.2L515.6 1353.8z"/><text class="kt" x="531.6" y="1362">Affected</text></svg>
