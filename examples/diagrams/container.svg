<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 994 1512" width="994" height="1512" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Checkout platform containers: Container diagram for the Checkout platform</title><desc id="dg-desc">Container diagram for the Checkout platform. 12 elements: Shopper (person), Checkout platform (software system), Storefront (container), API gateway (container), Order service (container), Payment service (container), Inventory service (container), Notification worker (container), Orders database (data store), Order events (queue), Stripe (external software system), Postmark (external software system). 10 relationships: Shopper to Storefront: Browses and checks out; Storefront to API gateway: Calls the storefront API; API gateway to Order service: Places and reads orders; Order service to Payment service: Requests payment authorisation; Order service to Inventory service: Reserves stock; Order service to Orders database: Reads and writes orders; Order service to Order events: Publishes order events; Payment service to Stripe: Creates payment intents; Order events to Notification worker: Delivers order events; Notification worker to Postmark: Sends order emails.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}</style><rect class="bg" x="0.5" y="0.5" width="993" height="1511" rx="12"/><text class="title" x="24" y="44">Checkout platform containers</text><text class="sub" x="24" y="64">Container diagram for the Checkout platform</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="200" width="946" height="962" rx="9"/><path class="e" d="M569 108L569 239"/><path class="ah" d="M569 246L564.8 237L573.2 237z"/><path class="e" d="M569 344L569 422"/><path class="ah" d="M569 429L564.8 420L573.2 420z"/><path class="e" d="M569 527L569 605"/><path class="ah" d="M569 612L564.8 603L573.2 603z"/><path class="e" d="M507 710L507 723Q507 730 500 730L236 730Q229 730 229 737L229 823Q229 830 222 830L129 830Q122 830 122 837L122 849.5"/><path class="ah" d="M122 856.5L117.8 847.5L126.2 847.5z"/><path class="e" d="M548 710L548 735Q548 742 541 742L363 742Q356 742 356 749L356 843"/><path class="ah" d="M356 850L351.8 841L360.2 841z"/><path class="e" d="M590 710L590 843"/><path class="ah" d="M590 850L585.8 841L594.2 841z"/><path class="e" d="M631 710L631 723Q631 730 638 730L817 730Q824 730 824 737L824 849.5"/><path class="ah" d="M824 856.5L819.8 847.5L828.2 847.5z"/><path class="e" d="M122 954.5L122 1247"/><path class="ah" d="M122 1254L117.8 1245L126.2 1245z"/><path class="e" d="M824 954.5L824 1039"/><path class="ah" d="M824 1046L819.8 1037L828.2 1037z"/><path class="e" d="M824 1144L824 1247"/><path class="ah" d="M824 1254L819.8 1245L828.2 1245z"/><rect class="f-group" x="10" y="212" width="229.9" height="20" rx="3"/><text class="gn" x="14" y="226">Checkout platform<tspan class="gk" dx="8">[Software System]</tspan></text><rect class="sh f-person" x="465" y="0" width="208" height="108" rx="20"/><circle class="glyph" cx="569" cy="15.5" r="6.5"/><path class="glyph" d="M558 34a11 10 0 0 1 22 0z"/><text class="nm" x="569" y="53.5">Shopper</text><text class="ty" x="569" y="69.5">[Person]</text><text class="ds" x="569" y="90.5">Buys goods from the storefront</text><rect class="sh f-container" x="465" y="246" width="208" height="98" rx="7"/><text class="nm" x="569" y="273.5">Storefront</text><text class="ty" x="569" y="289.5">[Container: TypeScript, Next.js]</text><text class="ds" x="569" y="310.5">Renders the catalogue, basket</text><text class="ds" x="569" y="326.5">and checkout pages</text><rect class="sh f-container" x="465" y="429" width="208" height="98" rx="7"/><text class="nm" x="569" y="456.5">API gateway</text><text class="ty" x="569" y="472.5">[Container: TypeScript, Fastify]</text><text class="ds" x="569" y="493.5">Authenticates sessions and</text><text class="ds" x="569" y="509.5">routes API calls</text><rect class="sh f-container" x="465" y="612" width="208" height="98" rx="7"/><text class="nm" x="569" y="639.5">Order service</text><text class="ty" x="569" y="655.5">[Container: Rust, Axum]</text><text class="ds" x="569" y="676.5">Owns the order lifecycle from</text><text class="ds" x="569" y="692.5">basket to fulfilment</text><rect class="sh f-container" x="18" y="856.5" width="208" height="98" rx="7"/><text class="nm" x="122" y="884">Payment service</text><text class="ty" x="122" y="900">[Container: Rust, Axum]</text><text class="ds" x="122" y="921">Authorises and captures card</text><text class="ds" x="122" y="937">payments</text><rect class="sh f-container" x="252" y="850" width="208" height="82" rx="7"/><text class="nm" x="356" y="877.5">Inventory service</text><text class="ty" x="356" y="893.5">[Container: Rust, Tonic]</text><text class="ds" x="356" y="914.5">Reserves and releases stock</text><rect class="sh f-container" x="720" y="1046" width="208" height="98" rx="7"/><text class="nm" x="824" y="1073.5">Notification worker</text><text class="ty" x="824" y="1089.5">[Container: Rust, Tokio]</text><text class="ds" x="824" y="1110.5">Turns order events into</text><text class="ds" x="824" y="1126.5">customer emails</text><path class="sh f-store" d="M486 858A104 8 0 0 1 694 858V953A104 8 0 0 1 486 953Z"/><path class="sh f-store dt" d="M486 858A104 8 0 0 0 694 858"/><text class="nm" x="590" y="887.5">Orders database</text><text class="ty" x="590" y="903.5">[Data Store: PostgreSQL 16]</text><text class="ds" x="590" y="924.5">Stores orders, payments and</text><text class="ds" x="590" y="940.5">stock reservations</text><path class="sh f-store" d="M731 856.5H917A11 49 0 0 1 917 954.5H731A11 49 0 0 1 731 856.5Z"/><path class="sh f-store dt" d="M917 856.5A11 49 0 0 0 917 954.5"/><text class="nm" x="824" y="884">Order events</text><text class="ty" x="824" y="900">[Queue: NATS JetStream]</text><text class="ds" x="824" y="921">Carries order lifecycle</text><text class="ds" x="824" y="937">events</text><rect class="sh f-external" x="18" y="1254" width="208" height="82" rx="7"/><text class="nm" x="122" y="1281.5">Stripe</text><text class="ty" x="122" y="1297.5">[External Software System]</text><text class="ds" x="122" y="1318.5">Processes card payments</text><rect class="sh f-external" x="720" y="1254" width="208" height="82" rx="7"/><text class="nm" x="824" y="1281.5">Postmark</text><text class="ty" x="824" y="1297.5">[External Software System]</text><text class="ds" x="824" y="1318.5">Delivers transactional email</text><rect class="halo" x="490" y="134" width="157" height="33" rx="4"/><text class="el" x="568.5" y="148">Browses and checks out</text><text class="et" x="568.5" y="161">[HTTPS]</text><rect class="halo" x="494" y="370" width="149" height="33" rx="4"/><text class="el" x="568.5" y="384">Calls the storefront API</text><text class="et" x="568.5" y="397">[JSON/HTTPS]</text><rect class="halo" x="490" y="553" width="157" height="33" rx="4"/><text class="el" x="568.5" y="567">Places and reads orders</text><text class="et" x="568.5" y="580">[gRPC]</text><rect class="halo" x="167" y="762" width="123" height="48" rx="4"/><text class="el" x="228.5" y="776">Requests payment</text><text class="el" x="228.5" y="790.5">authorisation</text><text class="et" x="228.5" y="803.5">[gRPC]</text><rect class="halo" x="304" y="769.5" width="103" height="33" rx="4"/><text class="el" x="355.5" y="783.5">Reserves stock</text><text class="et" x="355.5" y="796.5">[gRPC]</text><rect class="halo" x="511" y="769.5" width="157" height="33" rx="4"/><text class="el" x="589.5" y="783.5">Reads and writes orders</text><text class="et" x="589.5" y="796.5">[SQL]</text><rect class="halo" x="750" y="769.5" width="148" height="33" rx="4"/><text class="el" x="824" y="783.5">Publishes order events</text><text class="et" x="824" y="796.5">[NATS]</text><rect class="halo" x="43" y="1195" width="157" height="33" rx="4"/><text class="el" x="121.5" y="1209">Creates payment intents</text><text class="et" x="121.5" y="1222">[HTTPS]</text><rect class="halo" x="755" y="987" width="138" height="33" rx="4"/><text class="el" x="824" y="1001">Delivers order events</text><text class="et" x="824" y="1014">[NATS]</text><rect class="halo" x="760" y="1195" width="127" height="33" rx="4"/><text class="el" x="823.5" y="1209">Sends order emails</text><text class="et" x="823.5" y="1222">[HTTPS]</text></g><path class="rule" d="M24 1446H970"/><text class="kh" x="24" y="1464">KEY</text><rect class="sh f-person" x="24" y="1476" width="26" height="16" rx="8"/><circle class="glyph" cx="37" cy="1481.7" r="2.7"/><path class="glyph" d="M32.4 1489.5a4.6 4.2 0 0 1 9.2 0z"/><text class="kt" x="57" y="1488">Person</text><rect class="sh f-container" x="116.3" y="1476" width="26" height="16" rx="3"/><text class="kt" x="149.3" y="1488">Container</text><path class="sh f-store" d="M223.2 1479A13 3 0 0 1 249.2 1479V1489A13 3 0 0 1 223.2 1489Z"/><path class="sh f-store dt" d="M223.2 1479A13 3 0 0 0 249.2 1479"/><text class="kt" x="256.2" y="1488">Data Store</text><path class="sh f-store" d="M339.6 1476H357.6A4 8 0 0 1 357.6 1492H339.6A4 8 0 0 1 339.6 1476Z"/><path class="sh f-store dt" d="M357.6 1476A4 8 0 0 0 357.6 1492"/><text class="kt" x="368.6" y="1488">Queue</text><rect class="sh f-external" x="425.8" y="1476" width="26" height="16" rx="3"/><text class="kt" x="458.8" y="1488">External</text><rect class="sh grp f-group" x="524.4" y="1476" width="26" height="16" rx="3"/><text class="kt" x="557.4" y="1488">Boundary</text><path class="e" d="M630.6 1484L653.6 1484"/><path class="ah" d="M660.6 1484L651.6 1488.2L651.6 1479.8z"/><text class="kt" x="667.6" y="1488">Relationship</text></svg>
