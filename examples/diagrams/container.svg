<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 1129" width="968" height="1129" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Checkout platform containers: Container diagram for the Checkout platform</title><desc id="dg-desc">Container diagram for the Checkout platform. 12 elements: Shopper (person), Checkout platform (software system), Storefront (container), API gateway (container), Order service (container), Payment service (container), Inventory service (container), Notification worker (container), Orders database (data store), Order events (queue), Stripe (external software system), Postmark (external software system). 10 relationships: Shopper to Storefront: Browses and checks out; Storefront to API gateway: Calls the storefront API; API gateway to Order service: Places and reads orders; Order service to Payment service: Requests payment authorisation; Order service to Inventory service: Reserves stock; Order service to Orders database: Reads and writes orders; Order service to Order events: Publishes order events; Payment service to Stripe: Creates payment intents; Order events to Notification worker: Delivers order events; Notification worker to Postmark: Sends order emails.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}</style><rect class="bg" x="0.5" y="0.5" width="967" height="1128" rx="12"/><text class="title" x="24" y="44">Checkout platform containers</text><text class="sub" x="24" y="64">Container diagram for the Checkout platform</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="159" width="920" height="664" rx="9"/><path class="e" d="M553 83L553 190"/><path class="ah" d="M553 197L548.8 188L557.2 188z"/><path class="e" d="M553 251L553 313"/><path class="ah" d="M553 320L548.8 311L557.2 311z"/><path class="e" d="M553 374L553 436"/><path class="ah" d="M553 443L548.8 434L557.2 434z"/><path class="e" d="M491 497L491 504Q491 511 484 511L226 511Q219 511 219 518L219 592Q219 599 212 599L125 599Q118 599 118 606L118 615.5"/><path class="ah" d="M118 622.5L113.8 613.5L122.2 613.5z"/><path class="e" d="M532 497L532 516Q532 523 525 523L353 523Q346 523 346 530L346 606"/><path class="ah" d="M346 613L341.8 604L350.2 604z"/><path class="e" d="M574 497L574 606"/><path class="ah" d="M574 613L569.8 604L578.2 604z"/><path class="e" d="M615 497L615 504Q615 511 622 511L795 511Q802 511 802 518L802 615.5"/><path class="ah" d="M802 622.5L797.8 613.5L806.2 613.5z"/><path class="e" d="M118 676.5L118 892"/><path class="ah" d="M118 899L113.8 890L122.2 890z"/><path class="e" d="M802 676.5L802 748"/><path class="ah" d="M802 755L797.8 746L806.2 746z"/><path class="e" d="M802 809L802 892"/><path class="ah" d="M802 899L797.8 890L806.2 890z"/><rect class="f-group" x="10" y="171" width="229.9" height="20" rx="3"/><text class="gn" x="14" y="185">Checkout platform<tspan class="gk" dx="8">[Software System]</tspan></text><rect class="sh f-person" x="449" y="0" width="208" height="83" rx="20"/><circle class="glyph" cx="553" cy="15.5" r="6.5"/><path class="glyph" d="M542 34a11 10 0 0 1 22 0z"/><text class="nm" x="553" y="53.5">Shopper</text><text class="ty" x="553" y="69.5">[Person]</text><rect class="sh f-container" x="449" y="197" width="208" height="54" rx="7"/><text class="nm" x="553" y="221.5">Storefront</text><text class="ty" x="553" y="237.5">[Container: TypeScript, Next.js]</text><rect class="sh f-container" x="449" y="320" width="208" height="54" rx="7"/><text class="nm" x="553" y="344.5">API gateway</text><text class="ty" x="553" y="360.5">[Container: TypeScript, Fastify]</text><rect class="sh f-container" x="449" y="443" width="208" height="54" rx="7"/><text class="nm" x="553" y="467.5">Order service</text><text class="ty" x="553" y="483.5">[Container: Rust, Axum]</text><rect class="sh f-container" x="14" y="622.5" width="208" height="54" rx="7"/><text class="nm" x="118" y="647">Payment service</text><text class="ty" x="118" y="663">[Container: Rust, Axum]</text><rect class="sh f-container" x="242" y="613" width="208" height="54" rx="7"/><text class="nm" x="346" y="637.5">Inventory service</text><text class="ty" x="346" y="653.5">[Container: Rust, Tonic]</text><rect class="sh f-container" x="698" y="755" width="208" height="54" rx="7"/><text class="nm" x="802" y="779.5">Notification worker</text><text class="ty" x="802" y="795.5">[Container: Rust, Tokio]</text><path class="sh f-store" d="M470 621A104 8 0 0 1 678 621V678A104 8 0 0 1 470 678Z"/><path class="sh f-store dt" d="M470 621A104 8 0 0 0 678 621"/><text class="nm" x="574" y="650.5">Orders database</text><text class="ty" x="574" y="666.5">[Data Store: PostgreSQL 16]</text><path class="sh f-store" d="M709 622.5H895A11 27 0 0 1 895 676.5H709A11 27 0 0 1 709 622.5Z"/><path class="sh f-store dt" d="M895 622.5A11 27 0 0 0 895 676.5"/><text class="nm" x="802" y="647">Order events</text><text class="ty" x="802" y="663">[Queue: NATS JetStream]</text><rect class="sh f-external" x="14" y="899" width="208" height="54" rx="7"/><text class="nm" x="118" y="923.5">Stripe</text><text class="ty" x="118" y="939.5">[External Software System]</text><rect class="sh f-external" x="698" y="899" width="208" height="54" rx="7"/><text class="nm" x="802" y="923.5">Postmark</text><text class="ty" x="802" y="939.5">[External Software System]</text><rect class="halo" x="474" y="101" width="157" height="33" rx="4"/><text class="el" x="552.5" y="115">Browses and checks out</text><text class="et" x="552.5" y="128">[HTTPS]</text><rect class="halo" x="478" y="269" width="149" height="33" rx="4"/><text class="el" x="552.5" y="283">Calls the storefront API</text><text class="et" x="552.5" y="296">[JSON/HTTPS]</text><rect class="halo" x="474" y="392" width="157" height="33" rx="4"/><text class="el" x="552.5" y="406">Places and reads orders</text><text class="et" x="552.5" y="419">[gRPC]</text><rect class="halo" x="157" y="537" width="123" height="48" rx="4"/><text class="el" x="218.5" y="551">Requests payment</text><text class="el" x="218.5" y="565.5">authorisation</text><text class="et" x="218.5" y="578.5">[gRPC]</text><rect class="halo" x="294" y="544.5" width="103" height="33" rx="4"/><text class="el" x="345.5" y="558.5">Reserves stock</text><text class="et" x="345.5" y="571.5">[gRPC]</text><rect class="halo" x="495" y="544.5" width="157" height="33" rx="4"/><text class="el" x="573.5" y="558.5">Reads and writes orders</text><text class="et" x="573.5" y="571.5">[SQL]</text><rect class="halo" x="728" y="544.5" width="148" height="33" rx="4"/><text class="el" x="802" y="558.5">Publishes order events</text><text class="et" x="802" y="571.5">[NATS]</text><rect class="halo" x="39" y="848" width="157" height="33" rx="4"/><text class="el" x="117.5" y="862">Creates payment intents</text><text class="et" x="117.5" y="875">[HTTPS]</text><rect class="halo" x="733" y="704" width="138" height="33" rx="4"/><text class="el" x="802" y="718">Delivers order events</text><text class="et" x="802" y="731">[NATS]</text><rect class="halo" x="738" y="848" width="127" height="33" rx="4"/><text class="el" x="801.5" y="862">Sends order emails</text><text class="et" x="801.5" y="875">[HTTPS]</text></g><path class="rule" d="M24 1063H944"/><text class="kh" x="24" y="1081">KEY</text><rect class="sh f-person" x="24" y="1093" width="26" height="16" rx="8"/><circle class="glyph" cx="37" cy="1098.7" r="2.7"/><path class="glyph" d="M32.4 1106.5a4.6 4.2 0 0 1 9.2 0z"/><text class="kt" x="57" y="1105">Person</text><rect class="sh f-container" x="116.3" y="1093" width="26" height="16" rx="3"/><text class="kt" x="149.3" y="1105">Container</text><path class="sh f-store" d="M223.2 1096A13 3 0 0 1 249.2 1096V1106A13 3 0 0 1 223.2 1106Z"/><path class="sh f-store dt" d="M223.2 1096A13 3 0 0 0 249.2 1096"/><text class="kt" x="256.2" y="1105">Data Store</text><path class="sh f-store" d="M339.6 1093H357.6A4 8 0 0 1 357.6 1109H339.6A4 8 0 0 1 339.6 1093Z"/><path class="sh f-store dt" d="M357.6 1093A4 8 0 0 0 357.6 1109"/><text class="kt" x="368.6" y="1105">Queue</text><rect class="sh f-external" x="425.8" y="1093" width="26" height="16" rx="3"/><text class="kt" x="458.8" y="1105">External</text><rect class="sh grp f-group" x="524.4" y="1093" width="26" height="16" rx="3"/><text class="kt" x="557.4" y="1105">Boundary</text><path class="e" d="M630.6 1101L653.6 1101"/><path class="ah" d="M660.6 1101L651.6 1105.2L651.6 1096.8z"/><text class="kt" x="667.6" y="1105">Relationship</text></svg>
