<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1064" width="840" height="1064" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Checkout platform containers: Container diagram for the Checkout platform</title><desc id="dg-desc">Container diagram for the Checkout platform. 12 elements: Shopper (person), Checkout platform (software system), Storefront (container), API gateway (container), Order service (container), Payment service (container), Inventory service (container), Notification worker (container), Orders database (data store), Order events (queue), Stripe (external software system), Postmark (external software system). 10 relationships: Shopper to Storefront: Browses and checks out; Storefront to API gateway: Calls the storefront API; API gateway to Order service: Places and reads orders; Order service to Payment service: Requests payment authorisation; Order service to Inventory service: Reserves stock; Order service to Orders database: Reads and writes orders; Order service to Order events: Publishes order events; Payment service to Stripe: Creates payment intents; Order events to Notification worker: Delivers order events; Notification worker to Postmark: Sends order emails.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="839" height="1063" rx="12"/><text class="title" x="24" y="44">Checkout platform containers</text><text class="sub" x="24" y="64">Container diagram for the Checkout platform</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="138" width="792" height="615" rx="9"/><path class="e" d="M476 83L476 169"/><path class="ah" d="M476 176L471.8 167L480.2 167z"/><path class="e" d="M476 244L476 285"/><path class="ah" d="M476 292L471.8 283L480.2 283z"/><path class="e" d="M476 360L476 401"/><path class="ah" d="M476 408L471.8 399L480.2 399z"/><path class="e" d="M423 462L423 517Q423 524 416 524L109 524Q102 524 102 531L102 559.5"/><path class="ah" d="M102 566.5L97.8 557.5L106.2 557.5z"/><path class="e" d="M458 462L458 529Q458 536 451 536L301.5 536Q298 536 298 539.5L298 543"/><path class="ah" d="M298 550L293.8 541L302.2 541z"/><path class="e" d="M494 462L494 543"/><path class="ah" d="M494 550L489.8 541L498.2 541z"/><path class="e" d="M529 462L529 469Q529 476 536 476L683 476Q690 476 690 483L690 552.5"/><path class="ah" d="M690 559.5L685.8 550.5L694.2 550.5z"/><path class="e" d="M102 620.5L102 801"/><path class="ah" d="M102 808L97.8 799L106.2 799z"/><path class="e" d="M690 627.5L690 678"/><path class="ah" d="M690 685L685.8 676L694.2 676z"/><path class="e" d="M690 739L690 801"/><path class="ah" d="M690 808L685.8 799L694.2 799z"/><rect class="f-group" x="10" y="150" width="229.9" height="20" rx="3"/><text class="gn" x="14" y="164">Checkout platform<tspan class="gk" dx="8">[Software System]</tspan></text><rect class="sh f-person" x="388" y="0" width="176" height="83" rx="20"/><circle class="glyph" cx="476" cy="15.5" r="6.5"/><path class="glyph" d="M465 34a11 10 0 0 1 22 0z"/><text class="nm" x="476" y="53.5">Shopper</text><text class="ty" x="476" y="69.5">[Person]</text><rect class="sh f-container" x="388" y="176" width="176" height="68" rx="7"/><text class="nm" x="476" y="200.5">Storefront</text><text class="ty" x="476" y="216.5">[Container: TypeScript,</text><text class="ty" x="476" y="230.5">Next.js]</text><rect class="sh f-container" x="388" y="292" width="176" height="68" rx="7"/><text class="nm" x="476" y="316.5">API gateway</text><text class="ty" x="476" y="332.5">[Container: TypeScript,</text><text class="ty" x="476" y="346.5">Fastify]</text><rect class="sh f-container" x="388" y="408" width="176" height="54" rx="7"/><text class="nm" x="476" y="432.5">Order service</text><text class="ty" x="476" y="448.5">[Container: Rust, Axum]</text><rect class="sh f-container" x="14" y="566.5" width="176" height="54" rx="7"/><text class="nm" x="102" y="591">Payment service</text><text class="ty" x="102" y="607">[Container: Rust, Axum]</text><rect class="sh f-container" x="210" y="550" width="176" height="54" rx="7"/><text class="nm" x="298" y="574.5">Inventory service</text><text class="ty" x="298" y="590.5">[Container: Rust, Tonic]</text><rect class="sh f-container" x="602" y="685" width="176" height="54" rx="7"/><text class="nm" x="690" y="709.5">Notification worker</text><text class="ty" x="690" y="725.5">[Container: Rust, Tokio]</text><path class="sh f-store" d="M406 558A88 8 0 0 1 582 558V629A88 8 0 0 1 406 629Z"/><path class="sh f-store dt" d="M406 558A88 8 0 0 0 582 558"/><text class="nm" x="494" y="587.5">Orders database</text><text class="ty" x="494" y="603.5">[Data Store: PostgreSQL</text><text class="ty" x="494" y="617.5">16]</text><path class="sh f-store" d="M613 559.5H767A11 34 0 0 1 767 627.5H61