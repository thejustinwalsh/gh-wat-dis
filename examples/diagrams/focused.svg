nlo, Consolas, monospace;font-size:11.5px}.sk{font-size:10px;fill:var(--muted);text-anchor:end}.sm{font-size:13px;text-anchor:middle}.card{stroke:var(--stroke);stroke-width:1}.lane{fill:var(--group)}.ln{font-size:10.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="867" height="498" rx="12"/><text class="title" x="24" y="44">Payment retries move to idempotency keys</text><text class="sub" x="24" y="64">Container diagram for the payment retry change</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="0" width="820" height="323" rx="9"/><path class="e" d="M226 124L251 124Q258 124 258 131L258 210Q258 217 265 217L305 217"/><path class="ah" d="M312 217L303 221.2L303 212.8z"/><path class="e e-changed" d="M226 98L305 98"/><path class="b-changed" d="M312 98L303 102.2L303 93.8z"/><path class="e" d="M226 150L239 150Q246 150 246 157L246 288Q246 295 253 295L567 295Q574 295 574 288L574 141.5Q574 135 580.5 135L587 135"/><path class="ah" d="M594 135L585 139.2L585 130.8z"/><path class="e e-added" d="M520 98L587 98"/><path class="b-added" d="M594 98L585 102.2L585 93.8z"/><rect class="f-group" x="10" y="12" width="229.9" height="20" rx="3"/><text class="gn" x="14" y="26">Checkout platform<tspan class="gk" dx="8">[Software System]</tspan></text><rect class="sh f-container s-changed" x="18" y="72" width="208" height="104" rx="7"/><text class="nm" x="122" y="105.5">Order service</text><text class="ty" x="122" y="121.5">[Container: Rust, Axum]</text><text class="ds" x="122" y="142.5">Owns the order lifecycle from</text><text class="ds" x="122" y="158.5">basket to fulfilment</text><rect class="b-changed" x="141" y=