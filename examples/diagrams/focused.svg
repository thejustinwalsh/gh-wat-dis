<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 709 842" width="709" height="842" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Payment retries move to idempotency keys: Container diagram for the payment retry change</title><desc id="dg-desc">Container diagram for the payment retry change. 5 elements: Checkout platform (software system), Order service (container, changed), Payment service (container, changed), Inventory service (container), Orders database (data store). 4 relationships: Order service to Inventory service: Reserves stock; Order service to Payment service: Authorises payment with an idempotency key; Retried failed authorisations (changed); Order service to Orders database: Reads and writes orders; Payment service to Orders database: Reads and writes payment keys (added).</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}</style><rect class="bg" x="0.5" y="0.5" width="708" height="841" rx="12"/><text class="title" x="24" y="44">Payment retries move to idempotency keys</text><text class="sub" x="24" y="64">Container diagram for the payment retry change</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="0" width="661" height="640" rx="9"/><path class="e" d="M174 144L174 169Q174 176 181 176L349 176Q356 176 356 183L356 292"/><path class="ah" d="M356 299L351.8 290L360.2 290z"/><path class="e e-changed" d="M122 144L122 292"/><path class="b-changed" d="M122 299L117.8 290L126.2 290z"/><path class="e" d="M226 144L226 157Q226 164 233 164L558 164Q565 164 565 171L565 484Q565 491 558 491L198.7 491Q192 491 192 497.7L192 504.5"/><path class="ah" d="M192 511.5L187.8 502.5L196.2 502.5z"/><path class="e e-added" d="M122 397L122 504.5"/><path class="b-added" d="M122 511.5L117.8 502.5L126.2 502.5z"/><rect class="f-group" x="10" y="12" width="229.9" height="20" rx="3"/><text class="gn" x="14" y="26">Checkout platform<tspan class="gk" dx="8">[Software System]</tspan></text><rect class="sh f-container s-changed" x="70" y="46" width="208" height="98" rx="7"/><text class="nm" x="174" y="73.5">Order service</text><text class="ty" x="174" y="89.5">[Container: Rust, Axum]</text><text class="ds" x="174" y="110.5">Owns the order lifecycle from</text><text class="ds" x="174" y="126.5">basket to fulfilment</text><rect class="b-changed" x="189.6" y="37" width="78.4" height="18" rx="9"/><text class="bt" x="228.8" y="49.5">~ CHANGED</text><rect class="sh f-container s-changed" x="18" y="299" width="208" height="98" rx="7"/><text class="nm" x="122" y="326.5">Payment service</text><text class="ty" x="122" y="342.5">[Container: Rust, Axum]</text><text class="ds" x="122" y="363.5">Authorises and captures card</text><text class="ds" x="122" y="379.5">payments</text><rect class="b-changed" x="137.6" y="290" width="78.4" height="18" rx="9"/><text class="bt" x="176.8" y="302.5">~ CHANGED</text><rect class="sh f-container" x="252" y="299" width="208" height="82" rx="7"/><text class="nm" x="356" y="326.5">Inventory service</text><text class="ty" x="356" y="342.5">[Container: Rust, Tonic]</text><text class="ds" x="356" y="363.5">Reserves and releases stock</text><path class="sh f-store" d="M53 519A104 8 0 0 1 261 519V614A104 8 0 0 1 53 614Z"/><path class="sh f-store dt" d="M53 519A104 8 0 0 0 261 519"/><text class="nm" x="157" y="548.5">Orders database</text><text class="ty" x="157" y="564.5">[Data Store: PostgreSQL 16]</text><text class="ds" x="157" y="585.5">Stores orders, payments and</text><text class="ds" x="157" y="601.5">stock reservations</text><rect class="halo" x="304" y="218" width="103" height="33" rx="4"/><text class="el" x="355.5" y="232">Reserves stock</text><text class="et" x="355.5" y="245">[gRPC]</text><rect class="halo" x="37" y="196" width="169" height="77" rx="4"/><text class="el" x="121.5" y="210"><tspan class="m-changed">~</tspan> Authorises payment with</text><text class="el" x="121.5" y="224.5">an idempotency key;</text><text class="el" x="121.5" y="239">Retried failed</text><text class="el" x="121.5" y="253.5">authorisations</text><text class="et" x="121.5" y="266.5">[gRPC]</text><rect class="halo" x="486" y="331.5" width="157" height="33" rx="4"/><text class="el" x="564.5" y="345.5">Reads and writes orders</text><text class="et" x="564.5" y="358.5">[SQL]</text><rect class="halo" x="58" y="423" width="127" height="48" rx="4"/><text class="el" x="121.5" y="437"><tspan class="m-added">+</tspan> Reads and writes</text><text class="el" x="121.5" y="451.5">payment keys</text><text class="et" x="121.5" y="464.5">[SQL]</text></g><path class="rule" d="M24 750H685"/><text class="kh" x="24" y="768">KEY</text><rect class="sh f-container" x="24" y="780" width="26" height="16" rx="3"/><text class="kt" x="57" y="792">Container</text><path class="sh f-store" d="M130.8 783A13 3 0 0 1 156.8 783V793A13 3 0 0 1 130.8 793Z"/><path class="sh f-store dt" d="M130.8 783A13 3 0 0 0 156.8 783"/><text class="kt" x="163.8" y="792">Data Store</text><rect class="sh grp f-group" x="243.2" y="780" width="26" height="16" rx="3"/><text class="kt" x="276.2" y="792">Boundary</text><path clas