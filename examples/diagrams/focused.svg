<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 499" width="868" height="499" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Payment retries move to idempotency keys: Container diagram for the payment retry change</title><desc id="dg-desc">Container diagram for the payment retry change. 5 elements: Checkout platform (software system), Order service (container, changed), Payment service (container, changed), Inventory service (container), Orders database (data store). 4 relationships: Order service to Inventory service: Reserves stock; Order service to Payment service: Authorises payment with an idempotency key; Retried failed authorisations (changed); Order service to Orders database: Reads and writes orders; Payment service to Orders database: Reads and writes payment keys (added).</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{f