name: Publish

# Publishes the version in package.json to npm, then tags it and makes a GitHub release.
# Run it by hand from the Actions tab (or `gh workflow run publish.yml`) on main, after the version bump is merged.
# Auth is npm trusted publishing: GitHub's OIDC token, no NPM_TOKEN secret.
# The package's npm settings list this repository, this workflow file and the `release` environment as the trusted publisher.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: The version must not be on npm yet
        run: |
          if npm view "gh-wat-dis@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "gh-wat-dis@${{ steps.version.outputs.version }} is already on npm. Bump the version in package.json first."
            exit 1
          fi
      - name: The tag must not exist yet
        run: |
          if git ls-remote --exit-code --tags origin "v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "Tag v${{ steps.version.outputs.version }} already exists."
            exit 1
          fi
      - run: npm publish --provenance --access public
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes
