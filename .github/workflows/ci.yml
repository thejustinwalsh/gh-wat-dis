name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pack and run the tarball the way a consumer does
        run: |
          npm pack
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npx -y -p "$GITHUB_WORKSPACE"/gh-wat-dis-*.tgz gh-wat-dis --version
          npx -y -p "$GITHUB_WORKSPACE"/gh-wat-dis-*.tgz gh-wat-dis install --dry-run
          npx -y -p "$GITHUB_WORKSPACE"/gh-wat-dis-*.tgz gh-wat-dis diagram "$GITHUB_WORKSPACE/examples/diagrams/dynamic.json" -o flow.svg
          test -s flow.svg
