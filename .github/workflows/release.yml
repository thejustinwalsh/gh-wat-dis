name: Release

# Publishes to npm when a GitHub release is published.
# Auth is npm trusted publishing: GitHub's OIDC token, no NPM_TOKEN secret.
# The package's npm settings must list this repository and this workflow file as a trusted publisher.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - name: The release tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm publish --provenance --access public
