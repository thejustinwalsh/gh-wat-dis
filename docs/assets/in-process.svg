<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 758 1247" width="758" height="1247" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Text layout moves off the main thread: Component diagram for the editor monorepo, inside one browser tab</title><desc id="dg-desc">Component diagram for the editor monorepo, inside one browser tab. 11 elements: Browser tab (deployment node), Main thread (boundary), Layout worker (boundary, added), layout-core.wasm (boundary), @app/editor (component, changed), @app/renderer (component), @app/layout-client (component, added), @app/layout-worker (component, added), layout-core (component, affected), shaper (component), Glyph atlas (data store). 8 relationships: @app/editor to @app/layout-client: Requests layout for dirty paragraphs (added); @app/layout-client to @app/layout-worker: Posts LayoutRequest, gets glyph runs back (added); @app/layout-worker to layout-core: Calls layout_paragraph (added); layout-core to shaper: Shapes each run with; @app/layout-worker to Glyph atlas: Writes glyph bitmaps to (added); @app/renderer to Glyph atlas: Reads glyph bitmaps from; @app/editor to @app/renderer: Submits glyph runs to; @app/editor to layout-core: Called layout_paragraph on the main thread (removed).</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}.fd{font-size:12px;fill:var(--muted)}.fs{font-size:10.5px;fill:var(--muted)}.fb{font-size:12px;font-weight:600;fill:var(--fg)}.fn{font-size:11px;fill:var(--muted)}.sy{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.sk{font-size:10px;fill:var(--muted);text-anchor:end}.sm{font-size:13px;text-anchor:middle}.card{stroke:var(--stroke);stroke-width:1}.lane{fill:var(--group)}.ln{font-size:10.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="757" height="1246" rx="12"/><text class="title" x="24" y="44">Text layout moves off the main thread</text><text class="sub" x="24" y="64">Component diagram for the editor monorepo, inside one browser tab</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="0" width="710" height="1045" rx="9"/><rect class="sh grp f-bg" x="81" y="51" width="419" height="265" rx="9"/><rect class="sh grp f-bg s-added" x="103" y="406" width="593" height="469" rx="9"/><rect class="sh grp f-group" x="340" y="596" width="342" height="265" rx="9"/><path class="e e-added" d="M379 172L379 229.5"/><path class="b-added" d="M379 236.5L374.8 227.5L383.2 227.5z"/><path class="e e-added" d="M379 299.5L379 457"/><path class="b-added" d="M379 464L374.8 455L383.2 455z"/><path class="e e-added" d="M379 527L379 568Q379 575 386 575L573 575Q580 575 580 582L580 647"/><path class="b-added" d="M580 654L575.8 645L584.2 645z"/><path class="e" 