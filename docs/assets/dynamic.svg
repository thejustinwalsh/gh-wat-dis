0"/><text class="en" x="214" y="252">5</text><rect class="num" x="428" y="238" width="20" height="20" rx="10"/><text class="en" x="438" y="252">6</text><rect class="num" x="204" y="319" width="20" height="20" rx="10"/><text class="en" x="214" y="333">7</text></g><path class="rule" d="M24 474H662"/><text class="kh" x="24" y="492">KEY</text><rect class="sh f-person" x="24" y="504" width="26" height="16" rx="8"/><circle class="glyph" cx="37" cy="509.7" r="2.7"/><path class="glyph" d="M32.4 517.5a4.6 4.2 0 0 1 9.2 0z"/><text class="kt" x="57" y="516">Person</text><rect class="sh f-container" x="116.3" y="504" width="26" height="16" rx="3"/><text class="kt" x="149.3" y="516">Container</text><path class="sh f-store" d="M227.2 504H245.2A4 8 0 0 1 245.2 520H227.2A4 8 0 0 1 227.2 504Z"/><path class="sh f-store dt" d="M245.2 504A4 8 0 0 0 245.2 520"/><text class="kt" x="256.2" y="516">Queue</text><rect class="sh f-external" x="313.5" y="504" width="26" height="16" rx="3"/><text class="kt" x="346.5" y="516">External</text><path class="e" d="M412 512L435 512"/><path class="ah" d="M442 512L433 516.2L433 507.8z"/><text class="kt" x="449" y="516">Numbered step</text></svg>
