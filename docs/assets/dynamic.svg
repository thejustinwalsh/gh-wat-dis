<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 686 540" width="686" height="540" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Placing an order: Dynamic diagram for a successful card checkout</title><desc id="dg-desc">Dynamic diagram for a successful card checkout. 8 elements: Shopper (person), Storefront (container), API gateway (container), Order service (container), Inventory service (container), Payment service (container), Stripe (external software system), Order events (queue). 7 relationships: Shopper to Storefront: 1. Submits the checkout form; Storefront to API gateway: 2. Posts the order; API gateway to Order service: 3. Creates the order; Order service to Inventory service: 4. Reserves stock; Order service to Payment service: 5. Authorises the payment; Payment service to Stripe: 6. Confirms the payment intent; Order service to Order events: 7. Publishes OrderPlaced.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}.fd{font-size:12px;fill:var(--muted)}.fs{font-size:10.5px;fill:var(--muted)}.fb{font-size:12px;font-weight:600;fill:var(--fg)}.fn{font-size:11px;fill:var(--muted)}.sy{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.sk{font-size:10px;fill:var(--muted);text-anchor:end}.sm{font-size:13px;text-anchor:middle}.card{stroke:var(--stroke);stroke-width:1}.lane{fill:var(--group)}.ln{font-size:10.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="685" height="539" rx="12"/><text class="title" x="24" y="44">Placing an order</text><text class="sub" x="24" y="64">Dynamic diagram for a successful card checkout</text><g transform="translate(24 84)"><path class="e" d="M176 42L231 42"/><path class="ah" d="M238 42L229 46.2L229 37.8z"/><path class="e" d="M414 42L455 42"/><path class="ah" d="M462 42L453 46.2L453 37.8z"/><path class="e" d="M550 76L550 108Q550 115 543 115L95 115Q88 115 88 122L88 215"/><path class="ah" d="M88 222L83.8 213L92.2 213z"/><path class="e" d="M176 236L183 236Q190 236 190 229L190 182Q190 175 197 175L231 175"/><path class="ah" d="M238 175L229 179.2L229 170.8z"/><path class="e" d="M176 249L231 249"/><path class="ah" d="M238 249L229 253.2L229 244.8z"/><path class="e" d="M414 249L455 249"/><path class="ah" d="M462 249L453 253.2L453 244.8z"/><path class="e" d="M176 263L183 263Q190 263 190 270L190 323Q190 330 197 330L231 330"/><path class="ah" d="M238 330L229 334.2L229 325.8z"/><rect class="sh f-person" x="0" y="0" width="176" height="83" rx="20"/><circle class="glyph" cx="88" cy="15.5" r="6.5"/><path class="glyph" d="M77 34a11 10 0 0 1 22 0z"/><text class="nm" x="88" y="53.5">Shopper</text><text class="ty" x="88" y="69.5">[Person]</text><rect class="sh f-container" x="238" y="8" width="176" height