<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1022" width="750" height="1022" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Screen payments for fraud before capture: Container diagram for the fraud screening change</title><desc id="dg-desc">Container diagram for the fraud screening change. 9 elements: Checkout platform (software system), API gateway (container), Order service (container, affected), Payment service (container, changed), Fraud screening service (container, added), Nightly fraud job (container, removed), Orders database (data store), Order events (queue), Stripe (external software system). 8 relationships: API gateway to Order service: Places and reads orders; Order service to Payment service: Requests authorisation with basket and device details (changed); Payment service to Fraud screening service: Asks for a risk score (added); Fraud screening service to Order events: Publishes fraud decisions (added); Nightly fraud job to Orders database: Scanned yesterday&#39;s orders (removed); Order service to Orders database: Reads and writes orders (affected); Order service to Order events: Publishes order events; Payment service to Stripe: Creates payment intents.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}.fd{font-size:12px;fill:var(--muted)}.fs{font-size:10.5px;fill:var(--muted)}.fb{font-size:12px;font-weight:600;fill:var(--fg)}.fn{font-size:11px;fill:var(--muted)}.sy{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.sk{font-size:10px;fill:var(--muted);text-anchor:end}.sm{font-size:13px;text-anchor:middle}.card{stroke:var(--stroke);stroke-width:1}.lane{fill:var(--group)}.ln{font-size:10.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="749" height="1021" rx="12"/><text class="title" x="24" y="44">Screen payments for fraud before capture</text><text class="sub" x="24" y="64">Container diagram for the fraud screening change</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="0" width="702" height="690" rx="9"/><path class="e" d="M201 92L201 154"/><path class="ah" d="M201 161L196.8 152L205.2 152z"/><path class="e e-changed" d="M201 224L201 307Q201 314 208 314L276.2 314Q283 314 283 320.8L283 327.7"/><path class="b-changed" d="M283 334.7L278.8 325.7L287.2 325.7z"/><path class="e e-added" d="M248 397.7L248 473"/><path class="b-added" d="M248 480L243.8 471L252.2 471z"/><path class="e e-added" d="M248 543L248 615"/><path class="b-added" d="M248 622L243.8 613L252.2 613z"/><path class="e e-removed" d="M584 224L584 307Q584 314 577 314L549.7 314Q546 314 546 317.7L546 321.5"/><path class="b-removed" d="M546 328.5L541.8 319.5L550.2 319.5z"/><path class="e e-affected" d="M253 224L253 23