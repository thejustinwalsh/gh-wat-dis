<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 571" width="712" height="571" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Payments worker charges once for each event: Container diagram for the Shop</title><desc id="dg-desc">Container diagram for the Shop. 6 elements: Stripe (external software system), Storefront (container), Orders API (container, affected), Payments worker (container, changed), Orders database (data store, changed), Order events (queue). 5 relationships: Stripe to Payments worker: Delivers payment events to; Storefront to Payments worker: Starts a charge with; Orders API to Payments worker: Retries charges with (affected); Payments worker to Orders database: Stores payment keys in (added); Payments worker to Order events: Publishes paid orders to.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}.fd{font-size:12px;fill:var(--muted)}.fs{font-size:10.5px;fill:var(--muted)}.fb{font-size:12px;font-weight:600;fill:var(--fg)}.fn{font-size:11px;fill:var(--muted)}.sy{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.sk{font-size:10px;fill:var(--muted);text-anchor:end}.sm{font-size:13px;text-anchor:middle}.card{stroke:var(--stroke);stroke-width:1}.lane{fill:var(--group)}.ln{font-size:10.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="711" height="570" rx="12"/><text class="title" x="24" y="44">Payments worker charges once for each event</text><text class="sub" x="24" y="64">Container diagram for the Shop</text><g transform="translate(24 84)"><path class="e" d="M104 63L104 121Q104 128 111 128L276.5 128Q280 128 280 131.5L280 135"/><path class="ah" d="M280 142L275.8 133L284.2 133z"/><path class="e" d="M332 63L332 135"/><path class="ah" d="M332 142L327.8 133L336.2 133z"/><path class="e e-affected" d="M560 63L560 121Q560 128 553 128L387.5 128Q384 128 384 131.5L384 135"/><path class="b-affected" d="M384 142L379.8 133L388.2 133z"/><path class="e e-added" d="M297 205L297 277"/><path class="b-added" d="M297 284L292.8 275L301.2 275z"/><path class="e" d="M367 205L367 212Q367 219 374 219L518 219Q525 219 525 226L525 277"/><path class="ah" d="M525 284L520.8 275L529.2 275z"/><rect class="sh f-external" x="0" y="9" width="208" height="54" rx="7"/><text class="nm" x="104" y="33.5">Stripe</text><text class="ty" x="104" y="49.5">[External Software System]</text><rect class="sh f-container" x="228" y="9" width="208" height="54" rx="7"/><text class="nm" x="332" y="33.5">Storefront</text><text class="ty" x="332" y="49.5">[Container: Next.js]</text><rect class="sh f-container s-affected" x="456" y="0" width="208" height="63" rx="7"/><rect class="ring" x="452" y="-4" width="216" height="71" rx="11"/><text class="nm" x="560" y="33.5">Orders API</text><text class="ty" x="560" y="49.5">[Container: TypeScript, Node.js]</text><rect class="b-affected" x="586" y="5" width="72" height="16" rx="8"/><text class="bt" x="622" y="16.4">AFFECTED</text><rect class="sh f-container s-changed" x="228" y="142" width="208" height="63" rx="7"/><text class="nm" x="332" y="175.5">Payments worker</text><text class="ty" x="332" y="191.5">[Container: TypeScript, Node.js]</text><rect class="b-changed" x="351" y="147" width="79" height="16" rx="8"/><text class="bt" x="390.5" y="158.4">~ CHANGED</text><path class="sh f-store s-changed" d="M193 292A104 8 0 0 1 401 292V361A104 8 0 0 1 193 361Z"/><path class="sh f-store s-changed dt" d="M193 292A104 8 0 0 0 401 292"/><text class="nm" x="297" y="333.5">Orders database</text><text class="ty" x="297" y="349.5">[Data Store: PostgreSQL 16]</text><rect class="b-changed" x="314" y="305" width="79" height="16" rx="8"/><text class="bt" x="353.5" y="316.4">~ CHANGED</text><path class="sh f-store" d="M432 284H618A11 27 0 0 1 618 338H432A11 27 0 0 1 432 284Z"/><path class="sh f-store dt" d="M618 284A11 27 0 0 0 618 338"/><text class="nm" x="525" y="308.5">Order events</text><text class="ty" x="525" y="324.5">[Queue: NATS JetStream]</text><rect class="halo" x="17" y="81" width="173" height="33" rx="4"/><text class="el" x="103.5" y="95">Delivers payment events to</text><text class="et" x="103.5" y="108">[HTTPS webhook]</text><rect class="halo" x="267" y="81" width="130" height="33" rx="4"/><text class="el" x="332" y="95">Starts a charge with</text><text class="et" x="332" y="108">[NATS]</text><rect class="halo" x="488" y="81" width="144" height="33" rx="4"/><text class="el" x="560" y="95"><tspan class="m-affected">•</tspan> Retries charges with</text><text class="et" x="560" y="108">[retryCharge import]</text><rect class="halo" x="216" y="233" width="162" height="33" rx="4"/><text class="el" x="297" y="247"><tspan class="m-added">+</tspan> Stores payment keys in</text><text clas