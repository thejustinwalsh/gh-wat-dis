<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 492 1019" width="492" height="1019" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Payments worker charges once for each event: Container diagram for the duplicate charge fix</title><desc id="dg-desc">Container diagram for the duplicate charge fix. 5 elements: Stripe (external software system), Shop (software system), Payments worker (container, changed), Orders API (container, affected), Orders database (data store, changed). 4 relationships: Stripe to Payments worker: Delivers payment events to; Payments worker to Orders database: Stores payment keys in (added); Orders API to Payments worker: Retries charges with (affected); Orders API to Orders database: Reads and writes orders.</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}.fd{font-size:12px;fill:var(--muted)}.fs{font-size:10.5px;fill:var(--muted)}.fb{font-size:12px;font-weight:600;fill:var(--fg)}.fn{font-size:11px;fill:var(--muted)}.sy{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.sk{font-size:10px;fill:var(--muted);text-anchor:end}.sm{font-size:13px;text-anchor:middle}.card{stroke:var(--stroke);stroke-width:1}.lane{fill:var(--group)}.ln{font-size:10.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="491" height="1018" rx="12"/><text class="title" x="24" y="44">Payments worker charges once for each event</text><text class="sub" x="24" y="64">Container diagram for the duplicate charge fix</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="190" width="427" height="601" rx="9"/><path class="e" d="M340 98L340 456"/><path class="ah" d="M340 463L335.8 454L344.2 454z"/><path class="e e-added" d="M305 567L305 639Q305 646 298 646L173.7 646Q167 646 167 652.7L167 659.5"/><path class="b-added" d="M167 666.5L162.8 657.5L171.2 657.5z"/><path class="e e-affected" d="M250 350L250 436Q250 443 257 443L263.5 443Q270 443 270 449.5L270 456"/><path class="b-affected" d="M270 463L265.8 454L274.2 454z"/><path class="e" d="M180 350L180 363Q180 370 173 370L104 370Q97 370 97 377L97 659.5"/><path class="ah" d="M97 666.5L92.8 657.5L101.2 657.5z"/><text class="gn" x="18" y="214">Shop<tspan class="gk" dx="8">[Software System]</tspan></text><rect class="sh f-external" x="236" y="0" width="208" height="98" rx="7"/><text class="nm" x="340" y="27.5">Stripe</text><text class="ty" x="340" y="43.5">[External Software System]</text><text class="ds" x="340" y="64.5">Retries a webhook when the</text><text class="ds" x="340" y="80.5">reply takes over 10 s</text><rect class="sh f-container s-changed" x="201" y="463" width="208" height="104" rx="7"/><text class="nm" x="305" y="496.5">Payments worker</text><text class="ty" x="30