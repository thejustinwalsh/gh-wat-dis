<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 709 849" width="709" height="849" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Payment retries move to idempotency keys: Container diagram for the payment retry change</title><desc id="dg-desc">Container diagram for the payment retry change. 5 elements: Checkout platform (software system), Order service (container, changed), Payment service (container, changed), Inventory service (container), Orders database (data store). 4 relationships: Order service to Inventory service: Reserves stock; Order service to Payment service: Authorises payment with an idempotency key; Retried failed authorisations (changed); Order service to Orders database: Reads and writes orders; Payment service to Orders database: Reads and writes payment keys (added).</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}.fd{font-size:12px;fill:var(--muted)}.fs{font-size:10.5px;fill:var(--muted)}.fb{font-size:12px;font-weight:600;fill:var(--fg)}.fn{font-size:11px;fill:var(--muted)}.sy{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.sk{font-size:10px;fill:var(--muted);text-anchor:end}.sm{font-size:13px;text-anchor:middle}.card{stroke:var(--stroke);stroke-width:1}.lane{fill:var(--group)}.ln{font-size:10.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="708" height="848" rx="12"/><text class="title" x="24" y="44">Payment retries move to idempotency keys</text><text class="sub" x="24" y="64">Container diagram for the payment retry change</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="0" width="661" height="647" rx="9"/><path class="e" d="M174 160L174 185Q174 192 181 192L349 192Q356 192 356 199L356 293"/><path class="ah" d="M356 300L351.8 291L360.2 291z"/><path class="e e-changed" d="M122 160L122 293"/><path class="b-changed" d="M122 300L117.8 291L126.2 291z"/><path class="e" d="M226 160L226 173Q226 180 233 180L558 180Q565 180 565 187L565 491Q565 498 558 498L198.7 498Q192 498 192 504.7L192 511.5"/><path class="ah" d="M192 518.5L187.8 509.5L196.2 509.5z"/><path class="e e-added" d="M122 404L122 511.5"/><path class="b-added" d="M122 518.5L117.8 509.5L126.2 509.5z"/><text class="gn" x="18" y="24">Checkout platform<tspan class="gk" dx="8">[Software System]</tspan></text><rect class="sh f-container s-changed" x="70" y="56" width="208" height="104" rx="7"/><text class="nm" x="174" y="89.5">Order service</text><text class="ty" x="174" y="105.5">[Container: Rust, Axum]</text><text class="ds" x="174" y="126.5">Owns the order lifecycle from</text><text class="ds" x="174" y="142.5">basket to fulfilment</text><rect class="b-changed" x="193" y="61" width="79" height="16" rx="8"/><text class="bt" x="232.5" y="72.4">~ CHANGED</text><rect class="sh f-container s-changed" x="18" y="300" width="208" height="104" rx="7"/><text class="nm" x="122" y="333.5">Payment service</text><text class="ty" x="122" y="349.5">[Container: Rust, Axum]</text><text class="ds" x="122" y="370.5">Authorises and captures card</text><text class="ds" x="122" y="386.5">payments</text><rect class="b-changed" x="141" y="305" width="79" height="16" rx="8"/><text class="bt" x="180.5" y="316.4">~ CHANGED</text><rect class="sh f-container" x="252" y="300" width="208" height="82" rx="7"/><text class="nm" x="356" y="327.5">Inventory service</text><text class="ty" x="356" y="343.5">[Container: Rust, Tonic]</text><text class="ds" x="356" y="364.5">Reserves and releases stock</text><path class="sh f-store" d="M53 526A104 8 0 0 1 261 526V621A104 8 0 0 1 53 621Z"/><path class="sh f-store dt" d="M53 526A104 8 0 0 0 261 526"/><text class="nm" x="157" y="555.5">Orders database</text><text class="ty" x="157" y="571.5">[Data Store: PostgreSQL 16]</text><text class="ds" x="157" y="592.5">Stores orders, payments and</text><text class="ds" x="157" y="608.5">stock reservations</text><rect class="halo" x="304" y="226.5" width="103" height="33" rx="4"/><text class="el" x="355.5" y="240.5">Reserves stock</text><text class="et" x="355.5" y="253.5">[gRPC]</text><rect class="halo" x="28" y="212" width="187" height="62" rx="4"/><text class="el" x="121.5" y="226"><tspan class="m-changed">~</tspan> Authorises payment with an</text><text class="el" x="121.5" y="240.5">idempotency key; Retried</text><text class="el" x="121.5" y="255">failed authorisations</text><text class="et" x="121.5" y="268">[gRPC]</text><rect class="halo" x="486" y="335.5" width="157" height="33" rx="4"/><text class="el" x="564.5" y="349.5">Reads and writes orders</text><text class="et" x="564.5" y="362.5">[SQL]</text><rect class="halo" x="31" y="430" width="181" height="48" rx="4"/><text class="el" x="121.5" y="444"><tspan class="m-added">+</