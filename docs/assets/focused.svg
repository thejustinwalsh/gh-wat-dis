r(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="867" height="492" rx="12"/><text class="title" x="24" y="44">Payment retries move to idempotency keys</text><text class="sub" x="24" y="64">Container diagram for the payment retry change</text><g transform="translate(24 84)"><rect class="sh grp f-group" x="0" y="0" width="820" height="317" rx="9"/><path class="e" d="M226 119L251 119Q258 119 258 126L258 204Q258 211 265 211L305 211"/><path class="ah" d="M312 211L303 215.2L303 206.8z"/><path class="e e-changed" d="M226 95L305 95"/><path class="b-changed" d="M312 95L303 99.2L303 90.8z"/><path class="e" d="M226 144L239 144Q246 144 246 151L246 282Q246 289 253 289L567 289Q574 289 574 282L574 138.5Q574 132 580.5 132L587 132"/><path class="ah" d="M594 132L585 136.2L585 127.8z"/><path class="e e-added" d="M520 95L587 95"/><path class="b-added" d="M594 95L585 99.2L585 90.8z"/><rect class="f-group" x="10" y="12" width="229.9" height="20" rx="3"/><text class="gn" x="14" y="26">Checkout platform<tspan class="gk" dx="8">[Software System]</tspan></text><rect class="sh f-container s-changed" x="18" y="70" width="208" height="98" rx="7"/><text class="nm" x="122" y="97.5">Order service</text><text class="ty" x="122" y="113.5">[Container: Rust, Axum]</text><text class="ds" x="122" y="134.5">Owns the order lifecycle from</text><text class="ds" x="122" y="150.5">basket to fulfilment</text><rect class="b-changed" x="137.6" y="61" width="78.4" height="18" rx="9"/><text class="bt" x="176.8" y="73.5">~ CHANGED</text><rect class="sh f-container s-changed" x="312" y="46" width="208" height="98" rx="7"/><text class="nm" x="416" y="73.5">Payment service</text><text class="ty" x="416" y="89.5">[Container: Rust, Axum]</text><text class="ds" x="416" y="110.5">Authorises and captures card</text><text class="ds" x="416" y="126.5">payments</text><rect class="b-changed" x="431.6" y="37" width="78.4" height="18" rx="9"/><text cla